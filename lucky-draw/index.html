<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lucky Draw</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
  <header class="top">
    <h1>🎉 Lucky Draw</h1>
    <div class="top-actions">
      <button class="btn ghost" id="fullscreenBtn" type="button">Fullscreen</button>
      <button class="btn ghost danger" id="resetBtn" type="button">Start over</button>
    </div>
  </header>

  <main class="layout">
    <!-- Setup -->
    <section class="card" id="setupCard">
      <h2>1. Add participants</h2>
      <label class="drop" id="dropZone">
        <input type="file" id="fileInput" accept=".xlsx,.xls,.csv,.ods" hidden>
        <strong>Upload Excel file</strong>
        <span class="muted">.xlsx, .xls or .csv &mdash; click or drag &amp; drop</span>
      </label>
      <p class="muted small">
        Names are read from the first sheet. Need a starting point?
        <button class="link-btn" id="templateBtn" type="button">Download template</button>
      </p>

      <div id="columnPicker" hidden>
        <label>Name column
          <select id="columnSelect"></select>
        </label>
        <label class="check"><input type="checkbox" id="headerCheck" checked> First row is a header</label>
      </div>

      <details>
        <summary>Or paste names</summary>
        <textarea id="pasteInput" rows="6" placeholder="One name per line"></textarea>
        <button class="btn" id="pasteBtn" type="button">Use pasted names</button>
      </details>

      <label class="check"><input type="checkbox" id="dedupeCheck" checked> Remove duplicate names</label>
      <p id="loadStatus" class="status" role="status"></p>
    </section>

    <!-- Stage -->
    <section class="card stage">
      <div class="counts">
        <span><b id="poolCount">0</b> remaining</span>
        <span><b id="winnerCount">0</b> winners</span>
      </div>
      <div class="round" id="roundLabel">Round 1</div>
      <div class="reel" id="reel" aria-live="polite">Upload names to begin</div>
      <button class="btn brand big" id="drawBtn" type="button" disabled>Draw winner</button>
      <button class="link-btn" id="undoBtn" type="button" hidden>Undo last draw</button>
    </section>

    <!-- Results -->
    <section class="card">
      <div class="row">
        <h2>Winners</h2>
        <button class="btn" id="exportBtn" type="button" disabled>Export to Excel</button>
      </div>
      <ol id="winnerList" class="winners"></ol>
      <p id="noWinners" class="muted">No winners yet.</p>

      <details>
        <summary>Remaining participants (<span id="poolCount2">0</span>)</summary>
        <ul id="poolList" class="pool"></ul>
      </details>
    </section>
  </main>

  <canvas id="confetti" aria-hidden="true"></canvas>
  <script src="app.js"></script>
</body>
</html>
