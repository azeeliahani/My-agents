<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stakeholder Mapping</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #58d68d;
    --green-deep: #2f9e63;
    --gold: #d6b25c;
    --gold-deep: #a8822f;
    --card: #eef3ef;
    --ink: #10221a;
    --muted: #607068;
    --hub: #0a281c;
    --legend: #7d8f86;
  }
  html, body { margin: 0; padding: 0; background: transparent; }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .stage {
    width: min(100vw, calc(100vh * 16 / 9));
    aspect-ratio: 16 / 9;
  }
  svg { display: block; width: 100%; height: 100%; overflow: visible; }

  /* ---------- animation ---------- */
  .fade   { opacity: 0; animation: fade .6s ease-out forwards; }
  .hub    { opacity: 0; transform-box: fill-box; transform-origin: center;
            animation: hubIn .8s cubic-bezier(.2,.8,.2,1) forwards, pulse 2.4s ease-in-out 3.2s 2; }
  .card-l { opacity: 0; animation: slideL .6s cubic-bezier(.2,.8,.2,1) forwards; }
  .card-r { opacity: 0; animation: slideR .6s cubic-bezier(.2,.8,.2,1) forwards; }
  .reveal { animation: draw .8s ease-out forwards; }
  .flow   { animation: flow 1s linear 2; }
  .dot    { opacity: 0; animation: fade .3s ease-out forwards; }

  @keyframes fade   { to { opacity: 1; } }
  @keyframes hubIn  { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
  @keyframes pulse  { 0%,100% { transform: scale(1); } 50% { transform: scale(1.025); } }
  @keyframes slideL { from { opacity: 0; transform: translateX(-60px); } to { opacity: 1; transform: none; } }
  @keyframes slideR { from { opacity: 0; transform: translateX(60px); } to { opacity: 1; transform: none; } }
  @keyframes draw   { to { stroke-dashoffset: 0; } }
  @keyframes flow   { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 26; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; opacity: 1 !important; stroke-dashoffset: 0 !important; }
  }
</style>
</head>
<body>
<div class="stage">
  <svg id="map" viewBox="0 0 1280 720" role="img" aria-label="Stakeholder mapping: customer stakeholders and their roles, internal stakeholders and their responsibilities">
    <defs>
      <radialGradient id="hubGlow">
        <stop offset="55%" stop-color="#58d68d" stop-opacity=".45"/>
        <stop offset="100%" stop-color="#58d68d" stop-opacity="0"/>
      </radialGradient>
      <filter id="shadow" x="-10%" y="-30%" width="120%" height="170%">
        <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000" flood-opacity=".28"/>
      </filter>
      <clipPath id="avatarClip"><circle cx="640" cy="346" r="30"/></clipPath>
    </defs>
    <g id="links"></g>
    <g id="cards"></g>
    <g id="hub" class="hub"></g>
    <g id="labels"></g>
  </svg>
</div>

<script>
const customer = [
  ["CIO", "Executive Sponsor", "chart"],
  ["IT Director", "Technical Approver", "chip"],
  ["Procurement Manager", "Commercial Reviewer", "doc"],
  ["Security Lead", "Compliance Reviewer", "shield"],
  ["CFO", "Financial Approver", "coin"],
];
const internal = [
  ["Product Team", "Product validation", "box"],
  ["Solution Architect", "Solution design", "bank"],
  ["ECSO", "Commercial governance", "scale"],
  ["Pricing Team", "Financial approval", "tag"],
  ["Bid Management", "Proposal quality", "doc"],
];

const NS = "http://www.w3.org/2000/svg";
const CW = 404, CH = 70, LX = 44, RX = 1280 - 44 - CW;
const ROWS = [160, 278, 396, 514, 632];
const CX = 640, CY = 390, CR = 104;
const GREEN = "#58d68d", GOLD = "#d6b25c";

function el(tag, attrs = {}, parent, text) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (text != null) n.textContent = text;
  if (parent) parent.appendChild(n);
  return n;
}

/* ---------- icons (24x24, centred at 0,0) ---------- */
const ICONS = {
  chart:  '<path d="M-10 10h20" /><rect x="-9" y="2" width="4" height="8" class="f"/><rect x="-2" y="-4" width="4" height="14" class="f"/><rect x="5" y="-10" width="4" height="20" class="f"/>',
  chip:   '<rect x="-8" y="-8" width="16" height="16" rx="2"/><rect x="-3" y="-3" width="6" height="6" class="f"/><path d="M-4-12v4M0-12v4M4-12v4M-4 8v4M0 8v4M4 8v4M-12-4h4M-12 0h4M-12 4h4M8-4h4M8 0h4M8 4h4"/>',
  doc:    '<rect x="-9" y="-12" width="18" height="24" rx="2"/><path d="M-5-5h10M-5 0h10M-5 5h10"/>',
  shield: '<path d="M0-12l10 5-1 11-9 8-9-8-1-11z"/><path d="M-5 0l4 4 7-8"/>',
  coin:   '<circle r="12"/><text y="1" text-anchor="middle" dominant-baseline="middle" class="t">$</text>',
  box:    '<path d="M0-12l11 6v13L0 13l-11-6V-6z"/><path d="M-11-6L0 0l11-6M0 0v13"/>',
  bank:   '<path d="M0-12l12 7h-24z"/><path d="M-7-3v10M0-3v10M7-3v10M-12 10h24"/>',
  scale:  '<path d="M0-12v22M-11-7h22M-6 11h12M-9-7l-5 10M-9-7l-4 10M9-7l-5 10M9-7l5 10"/><path d="M-15 3a6 6 0 0 0 12 0zM3 3a6 6 0 0 0 12 0z" class="f"/>',
  tag:    '<path d="M-11-11h12l11 11-11 11-12-12z"/><circle cx="-5" cy="-5" r="2" class="f"/>',
};

function drawIcon(parent, kind, x, y, col) {
  const g = el("g", { transform: `translate(${x} ${y})`, fill: "none", stroke: col,
                      "stroke-width": 2, "stroke-linecap": "round", "stroke-linejoin": "round" }, parent);
  g.innerHTML = ICONS[kind];
  g.querySelectorAll(".f").forEach(n => { n.setAttribute("fill", col); n.setAttribute("stroke", "none"); });
  g.querySelectorAll(".t").forEach(n => {
    n.setAttribute("fill", col); n.setAttribute("stroke", "none");
    n.setAttribute("font-size", "15"); n.setAttribute("font-weight", "700");
  });
}

/* ---------- cards ---------- */
const cards = document.getElementById("cards");
function card(i, [name, value, icon], side, delay) {
  const y = ROWS[i] - CH / 2;
  const x = side === "L" ? LX : RX;
  const g = el("g", { class: side === "L" ? "card-l" : "card-r", style: `animation-delay:${delay}s` }, cards);
  const accent = side === "L" ? "#34a868" : "#b08c3c";
  const clipId = `clip-${side}-${i}`;
  const cp = el("clipPath", { id: clipId }, g);
  el("rect", { x, y, width: CW, height: CH, rx: 14 }, cp);
  el("rect", { x, y, width: CW, height: CH, rx: 14, fill: "#eef3ef", filter: "url(#shadow)" }, g);
  el("rect", { x: side === "L" ? x : x + CW - 5, y, width: 5, height: CH, fill: accent, "clip-path": `url(#${clipId})` }, g);

  const iconBg = side === "L" ? "#dcece2" : "#f0e6ce";
  const iconCol = side === "L" ? "#247048" : "#967024";
  const lblCol = side === "L" ? "#28804f" : "#a07828";
  const label = side === "L" ? "ROLE" : "RESPONSIBILITY";
  const cy = ROWS[i];

  if (side === "L") {
    const ix = x + 44;
    el("rect", { x: ix - 20, y: cy - 20, width: 40, height: 40, rx: 10, fill: iconBg }, g);
    drawIcon(g, icon, ix, cy, iconCol);
    const tx = x + 80;
    el("text", { x: tx, y: cy - 12, "font-size": 20, "font-weight": 700, fill: "#10221a", "dominant-baseline": "middle" }, g, name);
    const t = el("text", { x: tx, y: cy + 14, "dominant-baseline": "middle" }, g);
    el("tspan", { "font-size": 11, "font-weight": 700, fill: lblCol, "letter-spacing": ".4" }, t, label);
    el("tspan", { dx: 8, "font-size": 16, fill: "#607068" }, t, value);
  } else {
    const ix = x + CW - 44;
    el("rect", { x: ix - 20, y: cy - 20, width: 40, height: 40, rx: 10, fill: iconBg }, g);
    drawIcon(g, icon, ix, cy, iconCol);
    const tx = x + CW - 80;
    el("text", { x: tx, y: cy - 12, "font-size": 20, "font-weight": 700, fill: "#10221a",
                 "text-anchor": "end", "dominant-baseline": "middle" }, g, name);
    const t = el("text", { x: tx, y: cy + 14, "text-anchor": "end", "dominant-baseline": "middle" }, g);
    el("tspan", { "font-size": 11, "font-weight": 700, fill: lblCol, "letter-spacing": ".4" }, t, label);
    el("tspan", { dx: 8, "font-size": 16, fill: "#607068" }, t, value);
  }
}
const CARD_START = 0.6, CARD_STEP = 0.2;
customer.forEach((c, i) => card(i, c, "L", CARD_START + i * CARD_STEP));
internal.forEach((c, i) => card(i, c, "R", CARD_START + 0.1 + i * CARD_STEP));

/* ---------- connectors ---------- */
const links = document.getElementById("links");
const LINK_START = CARD_START + 5 * CARD_STEP + 0.3, LINK_STEP = 0.12;
const allLinks = [...customer.map((_, i) => ["L", i]), ...internal.map((_, i) => ["R", i])];
allLinks.forEach(([side, i], k) => {
  const y = ROWS[i];
  const ex = side === "L" ? LX + CW : RX;
  const ang = Math.atan2(y - CY, ex - CX);
  const r = CR + 8;
  const hx = CX + r * Math.cos(ang), hy = CY + r * Math.sin(ang);
  const dir = side === "L" ? 1 : -1;
  // path runs hub -> card so the draw-in grows outward
  const d = `M${hx.toFixed(1)} ${hy.toFixed(1)} C${(hx + Math.cos(ang) * 80).toFixed(1)} ${(hy + Math.sin(ang) * 80).toFixed(1)} ${ex + dir * 90} ${y} ${ex} ${y}`;
  const col = side === "L" ? GREEN : GOLD;
  const delay = LINK_START + k * LINK_STEP;

  const maskId = `m-${side}-${i}`;
  const mask = el("mask", { id: maskId, maskUnits: "userSpaceOnUse", x: 0, y: 0, width: 1280, height: 720 }, links);
  const reveal = el("path", { d, fill: "none", stroke: "#fff", "stroke-width": 8 }, mask);
  const len = reveal.getTotalLength();
  reveal.setAttribute("stroke-dasharray", len);
  reveal.setAttribute("stroke-dashoffset", len);
  reveal.setAttribute("class", "reveal");
  reveal.style.animationDelay = `${delay}s`;

  const line = el("path", { d, fill: "none", stroke: col, "stroke-width": 2.2, "stroke-linecap": "round",
                            "stroke-dasharray": "7 6", mask: `url(#${maskId})`, class: "flow" }, links);
  line.style.animationDelay = `${LINK_START + allLinks.length * LINK_STEP + 1.2}s`;
  // flow inward toward the hub
  line.style.animationDirection = "reverse";

  el("circle", { cx: ex, cy: y, r: 6, fill: col, stroke: "#0a281c", "stroke-width": 2,
                 class: "dot", style: `animation-delay:${delay + 0.7}s` }, links);
});

/* ---------- hub ---------- */
const hub = document.getElementById("hub");
hub.innerHTML = `
  <circle cx="${CX}" cy="${CY}" r="${CR + 46}" fill="url(#hubGlow)"/>
  <circle cx="${CX}" cy="${CY}" r="${CR + 34}" fill="none" stroke="#78dca0" stroke-opacity=".25" stroke-width="1"/>
  <circle cx="${CX}" cy="${CY}" r="${CR + 20}" fill="none" stroke="#78dca0" stroke-opacity=".45" stroke-width="1"/>
  <circle cx="${CX}" cy="${CY}" r="${CR}" fill="#0a281c" stroke="#78dca0" stroke-width="2"/>
  <circle cx="${CX}" cy="346" r="32" fill="#164830" stroke="${GREEN}" stroke-width="2"/>
  <g clip-path="url(#avatarClip)">
    <ellipse cx="${CX}" cy="376" rx="30" ry="27" fill="#2e7850"/>
    <path d="M${CX - 6} 354 h12 l-6 14z" fill="#e8f0ea"/>
    <ellipse cx="${CX}" cy="337" rx="11" ry="13" fill="#ecc8aa"/>
    <path d="M${CX - 12} 335 a12 11 0 0 1 24 0z" fill="#281e18"/>
  </g>
  <text x="${CX}" y="400" text-anchor="middle" dominant-baseline="middle" font-size="22" font-weight="800" fill="#f0f8f3">Stakeholder</text>
  <text x="${CX}" y="426" text-anchor="middle" dominant-baseline="middle" font-size="22" font-weight="800" fill="${GREEN}">Mapping</text>
  <line x1="${CX - 22}" y1="448" x2="${CX + 22}" y2="448" stroke="${GOLD}" stroke-width="2"/>`;

/* ---------- headers & legend ---------- */
const labels = document.getElementById("labels");
const hdr = el("g", { class: "fade", style: "animation-delay:.6s" }, labels);
const hl = el("text", { x: LX + 4, y: 86, "font-size": 15, "font-weight": 800, fill: "#3fbf78",
                        "letter-spacing": ".3", "dominant-baseline": "middle" }, hdr, "CUSTOMER STAKEHOLDERS");
const hr = el("text", { x: RX + CW - 4, y: 86, "font-size": 15, "font-weight": 800, fill: "#c9a24a",
                        "letter-spacing": ".3", "text-anchor": "end", "dominant-baseline": "middle" }, hdr, "INTERNAL STAKEHOLDERS");
function badge(x, n, fill) {
  el("circle", { cx: x, cy: 86, r: 11, fill }, hdr);
  el("text", { x, y: 86, "font-size": 12, "font-weight": 700, fill: "#fff", "text-anchor": "middle", "dominant-baseline": "central" }, hdr, n);
}
function placeBadges() {
  badge(LX + 4 + hl.getComputedTextLength() + 20, customer.length, "#2f7a52");
  badge(RX + CW - 4 - hr.getComputedTextLength() - 20, internal.length, "#8a6f2c");
}
(document.fonts ? document.fonts.ready : Promise.resolve()).then(placeBadges);

const leg = el("g", { class: "fade", style: `animation-delay:${LINK_START + allLinks.length * LINK_STEP + 0.6}s` }, labels);
el("line", { x1: CX - 110, y1: 86, x2: CX - 84, y2: 86, stroke: GREEN, "stroke-width": 3, "stroke-linecap": "round" }, leg);
el("text", { x: CX - 76, y: 86, "font-size": 15, "font-weight": 600, fill: "var(--legend)", "dominant-baseline": "middle" }, leg, "Customer");
el("line", { x1: CX + 14, y1: 86, x2: CX + 40, y2: 86, stroke: GOLD, "stroke-width": 3, "stroke-linecap": "round" }, leg);
el("text", { x: CX + 48, y: 86, "font-size": 15, "font-weight": 600, fill: "var(--legend)", "dominant-baseline": "middle" }, leg, "Internal");
</script>
</body>
</html>
